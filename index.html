<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XREG Client Authentication</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #040509;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            user-select: none;
        }
        
        /* तैरने वाला गोल आइकन (0) */
        .floating-widget {
            position: fixed;
            bottom: 30px;
            left: 20px;
            width: 50px;
            height: 50px;
            background-color: #0b0d16;
            border: 2px solid #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            font-family: monospace;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
            z-index: 9999;
        }

        .top-bar {
            width: 100%;
            max-width: 350px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-top: 5px;
        }
        .status-dot { display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; background-color: #2563eb; border-radius: 50%; }
        
        .container {
            width: 100%;
            max-width: 350px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        /* XREG लोगो स्टाइल */
        .logo-box {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo-text {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #2563eb;
            font-style: italic;
            text-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
        }
        .logo-sub {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #3b82f6;
            margin-top: 8px;
            font-weight: 600;
        }

        /* लॉगिन फॉर्म एरिया */
        .form-area { width: 100%; }
        .input-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #475569;
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }
        .key-input {
            width: 100%;
            background-color: #0b0d16;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            color: #ffffff;
            font-size: 13px;
            font-family: monospace;
            letter-spacing: 2px;
            outline: none;
        }
        .msg-text {
            text-align: center;
            font-size: 10px;
            letter-spacing: 1px;
            color: #3b82f6;
            margin: 15px 0;
        }
        
        /* 100% असली वर्किंग एंकर बटन */
        .btn-primary {
            display: block;
            width: 100%;
            background: #2563eb !important;
            border: 1px solid #2563eb;
            color: #ffffff !important;
            padding: 15px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
        }

        .footer {
            width: 100%;
            max-width: 350px;
            text-align: center;
            font-size: 10px;
            color: #334155;
            border-top: 1px solid rgba(30, 41, 59, 0.3);
            padding-top: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- गोल तैरने वाला आइकन -->
    <div class="floating-widget">(0)</div>

    <div class="top-bar">
        <div class="status-dot"><span class="dot"></span> ACCESS REQUIRED</div>
        <div style="color: #2563eb; font-weight: bold;">LOCKED</div>
    </div>

    <div class="container">
        
        <!-- XREG लोगो हमेशा ऊपर रहेगा -->
        <div class="form-area">
            <div class="logo-box">
                <h1 class="logo-text">XREG</h1>
                <div class="logo-sub">Authentication Engine</div>
            </div>

            <label class="input-label">LICENSE KEY</label>
            <input type="text" id="licenseKey" value="XREG-90B3-A606-76FC" class="key-input" readonly>
            <p id="msg" class="msg-text">■ CLICK AUTHENTICATE TO ACCESS ENGINE</p>
            
            <!-- यह बटन ब्राउज़र की सभी रुकावटों को पार करके 100% सीधे अगले पेज पर ले जाएगा -->
            <a href="dashboard.html" class="btn-primary">AUTHENTICATE</a>
        </div>

    </div>

    <div class="footer">
        A valid license unlocks the engine. Keys are bound to one device.
    </div>

</body>
</html>
