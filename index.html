<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XREG Client Menu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #040509;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            user-select: none;
        }
        .top-bar {
            width: 100%;
            max-width: 350px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-top: 5px;
        }
        .status-dot { display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; background-color: #2563eb; border-radius: 50%; }
        .container {
            width: 100%;
            max-width: 350px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .xreg-logo-box {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .claw-lines {
            position: absolute;
            width: 70px;
            height: 70px;
            border-left: 8px solid #2563eb;
            border-right: 8px solid #2563eb;
            transform: skewX(-20deg);
            filter: drop-shadow(0 0 15px rgba(37, 99, 235, 0.8));
        }
        .claw-lines::before {
            content: '';
            position: absolute;
            left: 22px;
            top: 0;
            width: 8px;
            height: 100%;
            background-color: #2563eb;
        }
        .logo-title {
            position: absolute;
            bottom: -25px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            text-transform: uppercase;
        }
        .form-area { width: 100%; }
        .input-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #475569;
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }
        .key-input {
            width: 100%;
            background-color: #0b0d16;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            color: #ffffff;
            font-size: 13px;
            font-family: monospace;
            letter-spacing: 2px;
            outline: none;
        }
        .key-input:focus { border-color: #2563eb; }
        .msg-text {
            text-align: center;
            font-size: 10px;
            letter-spacing: 1px;
            color: #3b82f6;
            margin: 15px 0;
        }
        .btn-primary {
            width: 100%;
            background: transparent;
            border: 1px solid #2563eb;
            color: #3b82f6;
            padding: 15px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-primary:hover {
            background-color: rgba(37, 99, 235, 0.1);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }
        .status-panel { width: 100%; display: none; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 12px;
        }
        .info-label { color: #475569; font-weight: 600; text-transform: uppercase; }
        .info-value { color: #ffffff; font-family: monospace; }
        .text-green { color: #22c55e; font-weight: bold; }
        .footer {
            width: 100%;
            max-width: 350px;
            text-align: center;
            font-size: 10px;
            color: #334155;
            border-top: 1px solid rgba(30, 41, 59, 0.3);
            padding-top: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="status-dot"><span class="dot"></span> ACCESS REQUIRED</div>
        <div id="topLocked" style="color: #2563eb; font-weight: bold;">LOCKED</div>
    </div>

    <div class="container">
        
        <!-- स्क्रीन 1: लॉगिन फॉर्म -->
        <div id="loginScreen" class="form-area">
            <div class="xreg-logo-box">
                <div class="claw-lines"></div>
                <div class="logo-title">XREG</div>
            </div>

            <label class="input-label">LICENSE KEY</label>
            <!-- अटकाने वाला पुराना लॉजिक हटा दिया गया है -->
            <input type="text" id="licenseKey" placeholder="XREG-XXXX-XXXX-XXXX" class="key-input" autocomplete="off">
            <p id="msg" class="msg-text">■ ENTER YOUR FULL KEY</p>
            <button onclick="processAuth()" class="btn-primary">AUTHENTICATE</button>
        </div>

        <!-- स्क्रीन 2: इन-गेम डैशबोर्ड -->
        <div id="dashboardScreen" class="status-panel">
            <div class="xreg-logo-box" style="margin-bottom: 20px; transform: scale(0.8);">
                <div class="claw-lines"></div>
                <div class="logo-title">XREG</div>
            </div>
            
            <div class="info-row"><span class="info-label">Status</span><span class="info-value text-green">● Active</span></div>
            <div class="info-row"><span class="info-label">HWID</span><span class="info-value">ed268ed01d67b7e8</span></div>
            <div class="info-row"><span class="info-label">Device</span><span class="info-value">CPH2269</span></div>
            <div class="info-row"><span class="info-label">Expires In</span><span class="info-value text-green">29d 23h 59m</span></div>

            <button class="btn-primary" style="margin-top: 25px;" onclick="goToHapp()">ADD TO HAPP</button>
        </div>

    </div>

    <div class="footer">
        A valid license unlocks the engine. Keys are bound to one device.
    </div>

    <script>
        function processAuth() {
            const input = document.getElementById('licenseKey');
            const msg = document.getElementById('msg');
            const key = input.value.trim();
            
            if (key === "") {
                msg.innerText = "✖ PLEASE ENTER A KEY";
                msg.style.color = "#ef4444";
                return;
            }

            msg.innerText = "⏳ VERIFYING LICENSE...";
            msg.style.color = "#3b82f6";

            setTimeout(() => {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                document.getElementById('topLocked').innerText = 'ACTIVE';
                document.getElementById('topLocked').style.color = '#22c55e';
            }, 1000);
        }

        function goToHapp() {
            window.location.href = "https://t.me"; 
        }
    </script>
</body>
</html>
