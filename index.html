<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XREG Client Authentication</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050508 !important;
            color: #9ca3af !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            user-select: none;
        }
        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-top: 10px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #2563eb;
            border-radius: 50%;
        }
        .status-right {
            color: #2563eb;
            font-weight: bold;
            letter-spacing: 3px;
        }
        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin: 32px 0;
        }
        .logo-box {
            text-align: center;
            margin-bottom: 48px;
        }
        .logo-text {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #2563eb;
            font-style: italic;
            text-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
        }
        .logo-sub {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #3b82f6;
            margin-top: 8px;
            font-weight: 600;
        }
        .form-box {
            width: 100%;
        }
        .label-text {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            color: #4b5563;
            font-weight: 600;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .input-field {
            width: 100%;
            background-color: #0d0e12 !important;
            border: 1px solid #1f2937 !important;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            letter-spacing: 3px;
            color: #ffffff !important;
            font-size: 14px;
            font-family: monospace;
            text-transform: uppercase;
            outline: none;
        }
        .status-msg {
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #3b82f6;
            margin-top: 12px;
            margin-bottom: 20px;
        }
        .auth-btn {
            width: 100%;
            background-color: transparent !important;
            border: 1px solid #2563eb !important;
            color: #3b82f6 !important;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
        }
        .footer-text {
            width: 100%;
            max-width: 400px;
            text-align: center;
            font-size: 11px;
            letter-spacing: 1px;
            color: #4b5563;
            border-top: 1px solid rgba(31, 41, 55, 0.5);
            padding-top: 16px;
            margin-bottom: 8px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <div class="status-left"><span class="dot"></span>ACCESS REQUIRED</div>
        <div class="status-right">LOCKED</div>
    </div>

    <div class="main-container">
        <div class="logo-box">
            <h1 class="logo-text">XREG</h1>
            <div class="logo-sub">Authentication Engine</div>
        </div>

        <div class="form-box">
            <label class="label-text">LICENSE KEY</label>
            <input type="text" id="licenseKey" placeholder="XREG-XXXX-XXXX-XXXX" maxlength="19" class="input-field" autocomplete="off">
            <p id="statusMsg" class="status-msg">■ ENTER YOUR FULL KEY</p>
            <button onclick="checkLicense()" class="auth-btn">AUTHENTICATE</button>
        </div>
    </div>

    <div class="footer-text">
        A valid license unlocks the engine. Keys are bound to one device.
    </div>

    <script>
        const input = document.getElementById('licenseKey');
        const status = document.getElementById('statusMsg');

        input.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^a-zA-Z0-0]/g, '').toUpperCase();
            if (val.length > 0 && !val.startsWith('XREG')) { val = 'XREG' + val; }
            let formatted = '';
            for (let i = 0; i < val.length; i++) {
                if (i === 4 || i === 8 || i === 12) { formatted += '-'; }
                formatted += val[i];
            }
            e.target.value = formatted.substring(0, 19);
        });

        function checkLicense() {
            const key = input.value;
            if (key.length < 19) {
                status.innerText = "✖ INVALID KEY LENGTH";
                status.style.color = "#ef4444";
                return;
            }
            if (key === "XREG-1111-2222-3333") {
                status.innerText = "✔ ACCESS GRANTED! UNLOCKING...";
                status.style.color = "#22c55e";
            } else {
                status.innerText = "✖ INVALID OR EXPIRED LICENSE KEY";
                status.style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
